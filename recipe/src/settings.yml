---
name: ShowPoster
strategy: polling
polling_verb: get
polling_url: |-
  https://api.themoviedb.org/3/movie/upcoming?api_key={{ api_key | strip }}&language={% if language == 'fr' %}fr-FR{% else %}en-US{% endif %}&region={{ region | default: 'FR' }}&page=1
  https://api.themoviedb.org/3/movie/upcoming?api_key={{ api_key | strip }}&language={% if language == 'fr' %}fr-FR{% else %}en-US{% endif %}&region={{ region | default: 'FR' }}&page=2
  https://api.themoviedb.org/3/movie/now_playing?api_key={{ api_key | strip }}&language={% if language == 'fr' %}fr-FR{% else %}en-US{% endif %}&region={{ region | default: 'FR' }}&page=1
polling_headers: ''
refresh_interval: 60
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: ShowPoster
  description: "The next movies coming to theaters near you, and what is showing now, drawn as a poster. Data: The Movie Database (TMDB). / Les prochaines sorties au cinéma et les films à l'affiche, façon affiche."
- keyname: api_key
  field_type: string
  name: TMDB API key / Clé d'API TMDB
  description: The "API Key" (v3) from your TMDB account settings, free.
  help_text: Create a free account on <a href="https://www.themoviedb.org/settings/api">themoviedb.org</a>, then copy the <b>API Key</b> (not the Read Access Token).
- keyname: region
  field_type: select
  name: Country / Pays
  description: Theatrical release dates of this country.
  options:
  - France: FR
  - Belgique: BE
  - Suisse: CH
  - Canada: CA
  - United States: US
  - United Kingdom: GB
  default: FR
- keyname: featured
  field_type: select
  name: Poster / Affiche
  description: Which movies get the poster. Every hour the poster moves to another of the most awaited movies.
  options:
  - Rotate / Rotation: rotate
  - Coming soon / Prochainement: upcoming
  - Now showing / À l'affiche: now
  default: rotate
- keyname: language
  field_type: select
  name: Language / Langue
  options:
  - English: en
  - Français: fr
  default: en
- keyname: style
  field_type: select
  name: Style
  description: E-ink for black & white screens (TRMNL), Color for LCD screens.
  options:
  - E-ink: eink
  - Color / Couleur: color
  default: eink
