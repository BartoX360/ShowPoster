---
name: ShowPoster
strategy: polling
polling_verb: get
polling_url: |-
  https://api.trakt.tv/calendars/all/shows/premieres/{{ 'now' | date: '%Y-%m-%d' }}/33?extended=full&countries={{ origins | join: ',' | url_encode }}
  https://api.trakt.tv/shows/anticipated?limit=100
polling_headers: |-
  trakt-api-key={{ trakt_id | strip }}
  trakt-api-version=2
refresh_interval: 60
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: ShowPoster
  description: "The next new seasons and new series on TV and streaming, drawn as a poster. Data: Trakt; posters: The Movie Database (TMDB). / Les prochaines saisons et nouvelles séries, à la télé et en streaming, façon affiche."
- keyname: trakt_id
  field_type: string
  name: Trakt Client ID
  description: The Client ID of a (free) Trakt API app.
  help_text: On <a href="https://trakt.tv/oauth/applications/new">trakt.tv</a>, create an app with any redirect URI (e.g. http://localhost/callback), then copy its <b>Client ID</b>.
- keyname: tmdb_key
  field_type: string
  name: TMDB API key / Clé d'API TMDB
  description: Optional. For the posters and the French titles; without it, a TV set is drawn.
  help_text: The <b>API Key</b> (v3) from your free account on <a href="https://www.themoviedb.org/settings/api">themoviedb.org</a>.
  optional: true
- keyname: origins
  field_type: select
  name: Countries of origin / Pays d'origine
  description: Series made in any of the selected countries. Leave blank for all countries.
  help_text: Hold <kbd>Ctrl</kbd> (Windows) or <kbd>Command</kbd> (Mac) to select several countries.
  optional: true
  multiple: true
  options:
  - United States / États-Unis: us
  - United Kingdom / Royaume-Uni: gb
  - France: fr
  - Canada: ca
  - Belgium / Belgique: be
  - Spain / Espagne: es
  - Germany / Allemagne: de
  - Italy / Italie: it
  - Nordic / Pays nordiques: dk,se,no,fi,is
  - Australia / Australie: au
  - South Korea / Corée du Sud: kr
  - Japan / Japon: jp
- keyname: featured
  field_type: select
  name: Poster / Affiche
  description: Which series get the poster. Every hour the poster moves to another of the most followed or most awaited series.
  options:
  - Rotate / Rotation: rotate
  - New seasons / Nouvelles saisons: seasons
  - New series / Nouvelles séries: series
  default: rotate
- keyname: language
  field_type: select
  name: Language / Langue
  options:
  - English: en
  - Français: fr
  default: en
- keyname: style
  field_type: select
  name: Style
  description: E-ink for black & white screens (TRMNL), Color for LCD screens.
  options:
  - E-ink: eink
  - Color / Couleur: color
  default: eink
